<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>places.agent-mate.ai</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-icon.png" />
    <link rel="stylesheet" href="assets/mockup.css" />
  </head>
  <body class="auth-shell" data-title-key="admin.login.title">
    <a class="sr-only" href="#content" data-i18n="admin.a11y.skip">Skip to content</a>
    <div class="shell-locale">
      <div class="locale-switch" role="group" data-i18n="admin.a11y.locale" data-i18n-attr="aria-label">
        <button type="button" data-locale="EN">EN</button>
        <button type="button" data-locale="CN">CN</button>
        <button type="button" data-locale="HK">HK</button>
        <button type="button" data-locale="TW">TW</button>
      </div>
    </div>
    <main id="content" class="auth-main">
      <div class="auth-card auth-card-login">
        <a class="logo logo-auth" href="01-home.html" aria-label="places.agent-mate.ai">
          <img class="logo-full" src="assets/agent-logo.png" alt="" width="56" height="56" />
          <span class="logo-word">places.agent-mate.ai</span>
        </a>
        <p class="auth-status" data-i18n="admin.register.disabled_notice" data-testid="register-disabled">Open registration is closed. Ask an existing admin to invite you.</p>
        <div class="auth-login-panel auth-work">
          <h1 data-i18n="admin.login.title">Admin sign-in</h1>
          <p class="error" data-error hidden data-i18n="errors.login_failed" data-testid="login-error">Username or password is wrong.</p>
          <form class="form" action="06-keys.html">
            <label>
              <span data-i18n="admin.login.username">Username or email</span>
              <input type="text" name="identity" autocomplete="username" required />
            </label>
            <label>
              <span data-i18n="admin.login.password">Password</span>
              <span class="password-field">
                <input id="password" type="password" name="password" autocomplete="current-password" required />
                <button type="button" class="password-toggle" data-for="password" data-i18n="admin.login.show_password" data-i18n-attr="aria-label" aria-pressed="false">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </span>
            </label>
            <div class="form-actions">
              <button class="btn" type="submit" data-i18n="admin.login.submit" data-testid="login-submit">Sign in</button>
              <a class="btn-text" href="03-reset.html" data-i18n="admin.login.reset_link">Reset password</a>
            </div>
          </form>
          <a class="back-link" href="01-home.html" data-i18n="admin.common.back_home">Back to home</a>
        </div>
      </div>
    </main>
    <footer class="site-footer"><p data-i18n="admin.footer.copyright">copyright © Ethan Huang</p></footer>
    <script src="assets/i18n.js"></script>
    <script src="assets/mockup.js"></script>
  </body>
</html>
