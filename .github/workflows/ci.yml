name: CI

on:
  push:
    branches: [main, real-agent-refactory]
  pull_request:
  workflow_dispatch:

jobs:
  vitest-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: places_agent
          POSTGRES_PASSWORD: places_agent
          POSTGRES_DB: places_agent_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U places_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLACES_VENDOR_MODE: fixture
      DATABASE_URL: postgresql://places_agent:places_agent@localhost:5435/places_agent_test
      TEST_DATABASE_URL: postgresql://places_agent:places_agent@localhost:5435/places_agent_test
      SESSION_SECRET: ci-session-secret-32chars-minimum
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx vitest run
