<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>places.agent-mate.ai</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-icon.png" />
    <link rel="stylesheet" href="assets/mockup.css" />
  </head>
  <body class="auth-shell" data-title-key="admin.set_password.title">
    <a class="sr-only" href="#content" data-i18n="admin.a11y.skip">Skip to content</a>
    <div class="shell-locale">
      <div class="locale-switch" role="group" data-i18n="admin.a11y.locale" data-i18n-attr="aria-label">
        <button type="button" data-locale="EN">EN</button>
        <button type="button" data-locale="CN">CN</button>
        <button type="button" data-locale="HK">HK</button>
        <button type="button" data-locale="TW">TW</button>
      </div>
    </div>
    <main id="content" class="auth-main">
      <div class="auth-card auth-work">
        <div class="logo logo-auth" aria-label="places.agent-mate.ai">
          <img class="logo-full" src="assets/agent-logo.png" alt="" width="56" height="56" />
          <span class="logo-word">places.agent-mate.ai</span>
        </div>
        <h1 data-i18n="admin.set_password.title">Set a password</h1>
        <p class="lead" data-i18n="errors.password_required">Set a password before the landing can be used.</p>
        <p class="field-note" data-i18n="admin.set_password.lead">This account has no password yet. Set one before using the app.</p>
        <form class="form" action="06-keys.html" style="margin-top: 1.5rem">
          <label>
            <span data-i18n="admin.set_password.new">New password</span>
            <span class="password-field">
              <input id="new-password" type="password" name="password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-for="new-password" data-i18n="admin.login.show_password" data-i18n-attr="aria-label" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>
          <label>
            <span data-i18n="admin.set_password.confirm">Confirm password</span>
            <input type="password" name="confirm" autocomplete="new-password" required />
          </label>
          <div class="form-actions">
            <button class="btn" type="submit" data-i18n="admin.set_password.submit">Save password</button>
          </div>
        </form>
      </div>
    </main>
    <footer class="site-footer"><p data-i18n="admin.footer.copyright">copyright © Ethan Huang</p></footer>
    <script src="assets/i18n.js"></script>
    <script src="assets/mockup.js"></script>
  </body>
</html>
